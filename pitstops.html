<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Pit Stops — YouKnowBall.io</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,900;1,600&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --red:#FF1200; --black:#0A0A0A; --dark:#1A1A1A; --slate:#2E2E2E; --ash:#999; --white:#F5F5F5;
      --font-d:'Bebas Neue',sans-serif; --font-h:'Barlow Condensed',sans-serif; --font-b:'Barlow',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--black);min-height:100vh;display:flex;justify-content:center;font-family:var(--font-b);-webkit-font-smoothing:antialiased}
    #root{width:100%;max-width:480px;min-height:100vh;background:var(--black);color:var(--white);display:flex;flex-direction:column;position:relative}
    .header{background:var(--red);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .wordmark{font-family:var(--font-d);font-size:26px;letter-spacing:2px;color:var(--white);line-height:1;text-decoration:none}
    .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
    .header-mode{font-family:var(--font-d);font-size:20px;letter-spacing:1px;color:rgba(255,255,255,.75);line-height:1}
    .header-sub{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.4)}

    /* PIPS */
    .progress{background:var(--dark);padding:10px 20px;display:flex;gap:5px;border-bottom:1px solid var(--slate)}
    .pip{flex:1;height:4px;border-radius:2px;background:var(--slate);transition:background .4s}
    .pip.hit{background:#22c55e} .pip.miss{background:#ef4444} .pip.current{background:rgba(255,18,0,.4)}

    /* RULES */
    .rules-wrap{padding:28px 20px 40px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
    .rules-eyebrow{font-size:9px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--red)}
    .rules-title{font-family:var(--font-d);font-size:52px;letter-spacing:2px;color:var(--white);line-height:.95}
    .rules-sub{font-size:13px;color:var(--ash);line-height:1.6}
    .rules-list{display:flex;flex-direction:column}
    .rule-row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--slate)}
    .rule-row:last-child{border-bottom:none}
    .rule-icon{font-size:20px;min-width:28px;text-align:center;margin-top:1px}
    .rule-title{font-family:var(--font-h);font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--white);margin-bottom:3px}
    .rule-text{font-size:12px;color:var(--ash);line-height:1.5}
    .btn-play{width:100%;background:var(--red);border:none;border-radius:12px;padding:18px;font-family:var(--font-d);font-size:22px;letter-spacing:4px;color:var(--white);cursor:pointer;transition:all .2s}
    .btn-play:hover{background:#e01000;transform:translateY(-1px)}

    /* GAME */
    .game-wrap{padding:20px;display:flex;flex-direction:column;gap:14px;flex:1}
    .round-counter{display:flex;justify-content:space-between;align-items:flex-end}
    .round-label{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--ash)}
    .round-num{font-family:var(--font-d);font-size:18px;letter-spacing:2px;color:var(--red)}

    /* TRAIL CARD */
    .trail-card{background:var(--dark);border:1px solid var(--slate);border-radius:16px;overflow:hidden;transition:border-color .3s,box-shadow .3s}
    .trail-card.flash-correct{border-color:#22c55e;box-shadow:0 0 0 1px #22c55e,0 0 32px rgba(34,197,94,.15);animation:popCorrect .5s ease}
    .trail-card.flash-wrong{border-color:var(--red);box-shadow:0 0 0 1px var(--red);animation:shake .35s ease}
    @keyframes popCorrect{0%,100%{transform:scale(1)}40%{transform:scale(1.015)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    .trail-header{padding:16px 18px 14px;border-bottom:1px solid var(--slate)}
    .trail-meta{font-size:8px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--red);margin-bottom:8px}
    .trail-open{display:flex;gap:10px;flex-wrap:wrap}
    .open-pill{background:rgba(255,18,0,.08);border:1px solid rgba(255,18,0,.2);border-radius:8px;padding:6px 14px;display:flex;flex-direction:column;gap:2px}
    .open-pill-label{font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--red)}
    .open-pill-val{font-family:var(--font-h);font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--white)}
    .trail-stops{padding:14px 18px;display:flex;flex-direction:column}
    .stop-row{display:flex;align-items:center;gap:10px;padding:5px 0}
    .stop-num{font-family:var(--font-d);font-size:12px;color:#444;min-width:18px;text-align:right}
    .stop-revealed{display:flex;align-items:center;gap:10px;flex:1;animation:stopIn .35s cubic-bezier(.16,1,.3,1) both}
    @keyframes stopIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .stop-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}
    .stop-name{font-family:var(--font-h);font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--white)}
    .stop-connector{width:1px;height:10px;background:#252525;margin-left:28px}

    /* REVEAL BTN */
    .btn-reveal{width:100%;background:transparent;border:1px dashed #6f6f6f;border-radius:10px;padding:12px 16px;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--white);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px}
    .btn-reveal:hover:not(:disabled){border-color:var(--red);color:var(--red)}
    .btn-reveal:disabled{opacity:.2;cursor:not-allowed}
    .open-pill.locked .open-pill-val{color:#9a9a9a}
    .misses{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .miss-label{font-size:9px;font-weight:700;letter-spacing:3px;color:#d8d8d8;text-transform:uppercase}
    .miss-chip{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#ef4444;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
    .strikes-line{text-align:center;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#d8d8d8}
    .suggestions{max-height:190px;overflow-y:auto}

    /* INPUT */
    .input-wrap{position:relative}
    .guess-input{width:100%;background:var(--dark);border:1.5px solid var(--slate);border-radius:12px;padding:15px 18px;font-family:var(--font-h);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--white);outline:none;transition:border-color .2s;-webkit-appearance:none;caret-color:var(--red)}
    .guess-input:focus{border-color:var(--red)}
    .guess-input::placeholder{color:#2e2e2e;font-size:15px;text-transform:none;font-family:var(--font-b);font-weight:500;letter-spacing:0}
    .suggestions{position:absolute;top:100%;left:0;right:0;background:#111;border:1px solid var(--slate);border-radius:0 0 12px 12px;overflow:hidden;z-index:50;box-shadow:0 12px 40px rgba(0,0,0,.7)}
    .suggestion{padding:12px 18px;font-family:var(--font-h);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--white);cursor:pointer;border-bottom:1px solid var(--slate);transition:background .1s}
    .suggestion:last-child{border-bottom:none}
    .suggestion:hover{background:rgba(255,18,0,.1);color:var(--red)}
    .btn-submit{width:100%;background:var(--red);border:none;border-radius:12px;padding:16px;font-family:var(--font-d);font-size:22px;letter-spacing:4px;color:var(--white);cursor:pointer;transition:all .2s}
    .btn-submit:hover{background:#e01000;transform:translateY(-1px)}

    /* BETWEEN */
    .between{display:flex;flex-direction:column;align-items:center;padding:36px 20px;gap:18px;flex:1;animation:fadeUp .4s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .between-card{width:100%;background:var(--dark);border:1px solid var(--slate);border-radius:20px;padding:30px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
    .between-pin{font-size:52px;line-height:1}
    .between-label{font-family:var(--font-d);font-size:36px;letter-spacing:4px}
    .between-player{font-family:var(--font-h);font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-top:6px}
    .between-detail{font-size:11px;color:var(--ash);letter-spacing:2px;text-transform:uppercase}
    .full-trail{width:100%;background:var(--dark);border:1px solid var(--slate);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:0}
    .trail-row{display:flex;align-items:center;gap:10px;padding:4px 0;animation:stopIn .3s ease both}
    .trail-row-num{font-family:var(--font-d);font-size:12px;color:#444;min-width:18px;text-align:right}
    .trail-row-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0}
    .trail-row-name{font-family:var(--font-h);font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--white)}
    .trail-connector-sm{width:1px;height:8px;background:#252525;margin-left:28px}
    .next-pulse{font-size:10px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--ash);animation:blink 1.2s ease infinite}
    @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

    /* RESULTS */
    .results{display:flex;flex-direction:column;gap:14px;padding:22px 20px;animation:fadeUp .5s ease}
    .results-hero{background:var(--red);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;overflow:hidden}
    .results-hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.03) 39px,rgba(255,255,255,.03) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.03) 39px,rgba(255,255,255,.03) 40px)}
    .res-label{font-size:9px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.4);position:relative}
    .res-pins{font-size:40px;letter-spacing:4px;position:relative;line-height:1.2}
    .res-tagline{font-size:13px;font-weight:600;font-style:italic;color:rgba(255,255,255,.55);position:relative;text-align:center}
    .result-list{display:flex;flex-direction:column;gap:3px}
    .result-row{background:var(--dark);border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:12px}
    .res-emj{font-size:20px;min-width:24px;text-align:center}
    .res-info{flex:1}
    .res-name{font-family:var(--font-h);font-size:15px;font-weight:900;text-transform:uppercase;color:var(--white);letter-spacing:.5px}
    .res-detail{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ash);margin-top:2px}
    .res-stops{font-family:var(--font-d);font-size:13px;letter-spacing:1px;color:var(--ash);white-space:nowrap}
    .share-box{background:var(--dark);border:1px solid var(--slate);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
    .share-preview{font-size:14px;line-height:1.8;color:rgba(255,255,255,.5);font-family:var(--font-b)}
    .share-preview strong{color:var(--white);font-weight:700}
    .btn-share{width:100%;background:var(--red);border:2px solid transparent;border-radius:12px;padding:16px;font-family:var(--font-d);font-size:20px;letter-spacing:4px;color:var(--white);cursor:pointer;transition:all .2s}
    .btn-share:hover{background:#e01000}
    .btn-share.copied{background:transparent;color:var(--red);border-color:var(--red)}
    .btn-play-again{width:100%;background:transparent;border:1.5px solid var(--slate);border-radius:12px;padding:14px;font-family:var(--font-h);font-size:16px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ash);cursor:pointer;transition:all .2s}
    .btn-play-again:hover{border-color:var(--white);color:var(--white)}
    .midnight-note{text-align:center;font-size:9px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#252525;padding-bottom:16px}

    /* LOADING */
    .loading-screen{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
    .loading-text{font-family:var(--font-d);font-size:28px;letter-spacing:4px;color:var(--red);animation:blink 1.2s ease infinite}
    .loading-sub{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#2a2a2a}
      .upnext{margin:26px 0 6px}
    .upnext-kicker{text-align:center;font-family:var(--font-d);font-size:12px;letter-spacing:4px;color:var(--red);text-transform:uppercase;margin-bottom:10px}
    .upnext-card{display:flex;align-items:center;gap:12px;background:var(--dark);border:1px solid var(--slate);border-radius:14px;padding:12px 16px;margin-bottom:8px;text-decoration:none;transition:border-color .2s,transform .2s}
    .upnext-card:hover{border-color:var(--red);transform:translateY(-2px)}
    .upnext-meta{flex:1}
    .upnext-title{font-family:var(--font-d);font-size:17px;letter-spacing:1px;color:var(--white);line-height:1}
    .upnext-hook{font-size:12px;color:var(--ash);margin-top:3px;line-height:1.45}
    .upnext-play{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--red);white-space:nowrap}
</style>
</head>
<body>
<div id="root">
  <header class="header">
    <a href="/" class="wordmark">YOUKNOWBALL.</a>
    <div class="header-right">
      <div class="header-mode">PIT STOPS</div>
      <div class="header-sub">Career Trail</div>
    </div>
  </header>
  <div class="progress" id="pips"></div>
  <div id="screen"></div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://qoxgmscwbtdcvztksjtx.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFveGdtc2N3YnRkY3Z6dGtzanR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNTM5NTIsImV4cCI6MjA4NzcyOTk1Mn0.T0sIoWSSvVOG9Y0qnTdsK49gTOB9ffMeCFA4NWEqeXI'
);

const ROUNDS = 5;

// Report card: 📍 solved cold (no hints), 🗺️ needed a hint, 🗑️ struck out.
const MAX_MISSES = 3;
const GRADE_EMOJI = { pin: '📍', map: '🗺️', miss: '🗑️' };

function gradeFor(r) {
  if (!r.correct) return 'miss';
  return r.hints === 0 ? 'pin' : 'map';
}

function getDaySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function seededShuffle(arr, seed) {
  const a = [...arr]; let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let players = [], allNames = [];
let S = { round: 0, hints: 0, posRevealed: false, jerRevealed: false, misses: [], guess: '', suggs: [], flash: null, poolMsg: false, results: [], phase: 'loading' };

async function init() {
  render();
  try {
    const { data, error } = await sb.from('player_teams').select('*').eq('eligible', true).eq('verified', true);
    if (error) throw error;
    if (!data || data.length < ROUNDS) { showErr('Not enough players yet — check back soon!'); return; }

    allNames = data.map(p => p.player_name).sort();

    const seed = getDaySeed();
    const sh = seededShuffle(data, seed);
    const t1 = sh.filter(p => p.difficulty_tier === '1');
    const t2 = sh.filter(p => p.difficulty_tier === '2');
    const t3 = sh.filter(p => p.difficulty_tier === '3');

    // 2 easy, 2 medium, 1 hard
    let pool = [...t1.slice(0, 2), ...t2.slice(0, 2), ...t3.slice(0, 1)];
    if (pool.length < ROUNDS) {
      for (const p of sh) {
        if (!pool.find(x => x.player_name === p.player_name)) pool.push(p);
        if (pool.length >= ROUNDS) break;
      }
    }
    players = pool.slice(0, ROUNDS);
    // Merge jersey numbers from the players table (may be null for retired
    // players until the jersey refresh lands — the game degrades gracefully).
    try {
      const { data: jrows } = await sb.from('players').select('name,jersey_number').in('name', players.map(p => p.player_name));
      const jmap = {};
      (jrows || []).forEach(j => { if (jmap[j.name.toLowerCase()] === undefined) jmap[j.name.toLowerCase()] = j.jersey_number; });
      players.forEach(p => { p.jersey_number = jmap[p.player_name.toLowerCase()] ?? null; });
    } catch (e) { console.error('jersey merge failed', e); }
    S.phase = 'rules';
  } catch (e) {
    console.error(e);
    showErr('Failed to load. Try refreshing.');
    return;
  }
  render();
}

function showErr(msg) {
  document.getElementById('screen').innerHTML = `
    <div class="loading-screen">
      <div style="font-size:32px">⚠️</div>
      <div style="font-family:var(--font-d);font-size:18px;letter-spacing:3px;color:var(--ash);text-align:center;padding:0 20px">${msg}</div>
    </div>`;
}

function renderPips() {
  let h = '';
  for (let i = 0; i < ROUNDS; i++) {
    if (i < S.results.length) {
      h += `<div class="pip ${S.results[i].correct ? 'hit' : 'miss'}"></div>`;
    } else if (i === S.round && S.phase === 'playing') {
      h += `<div class="pip current"></div>`;
    } else {
      h += `<div class="pip"></div>`;
    }
  }
  document.getElementById('pips').innerHTML = h;
}

function render() {
  renderPips();
  const el = document.getElementById('screen');
  if (S.phase === 'loading')  { el.innerHTML = `<div class="loading-screen"><div class="loading-text">LOADING...</div><div class="loading-sub">Building career trails</div></div>`; return; }
  if (S.phase === 'rules')    { renderRules(); return; }
  if (S.phase === 'playing')  { renderGame(); return; }
  if (S.phase === 'between')  { renderBetween(); return; }
  if (S.phase === 'results')  { renderResults(); return; }
}

function renderRules() {
  document.getElementById('screen').innerHTML = `
    <div class="rules-wrap" style="justify-content:center;gap:26px">
      <div>
        <div class="rules-eyebrow">YouKnowBall · Career Trail</div>
        <div class="rules-title" style="font-size:46px;line-height:1">PIT STOPS.</div>
        <div class="rules-sub" style="margin-top:12px;font-size:19px;color:#fff;font-weight:600;line-height:1.5">5 players. Every career trail is on the board — name them.</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;font-size:14px;color:rgba(255,255,255,.75)">
        <div><span style="font-size:18px">📍</span>&nbsp;&nbsp;solve it cold</div>
        <div><span style="font-size:18px">🗺️</span>&nbsp;&nbsp;take a hint — position, then jersey #</div>
        <div><span style="font-size:18px">🗑️</span>&nbsp;&nbsp;three wrong guesses and the round's a miss</div>
      </div>
      <button class="btn-play" id="btn-start">LET'S ROLL</button>
    </div>`;
  document.getElementById('btn-start').addEventListener('click', () => { S.phase = 'playing'; render(); });
}

function renderGame() {
  const p = players[S.round];
  const stops = p.career_stops;
  const cardCls = `trail-card${S.flash === 'correct' ? ' flash-correct' : S.flash === 'wrong' ? ' flash-wrong' : ''}`;

  // Full trail is always visible — that's the game now.
  let stopsHtml = '';
  stops.forEach((stop, i) => {
    stopsHtml += `<div class="stop-row"><div class="stop-num">${i + 1}</div><div class="stop-revealed"><div class="stop-dot"></div><div class="stop-name">${stop}</div></div></div>`;
    if (i < stops.length - 1) stopsHtml += `<div class="stop-connector"></div>`;
  });

  const jerseyKnown = p.jersey_number != null;

  const posPill = S.posRevealed
    ? `<div class="open-pill"><div class="open-pill-label">Position</div><div class="open-pill-val">${p.position}</div></div>`
    : `<div class="open-pill locked"><div class="open-pill-label">Position</div><div class="open-pill-val">?</div></div>`;
  const jerPill = S.jerRevealed
    ? `<div class="open-pill"><div class="open-pill-label">Jersey #</div><div class="open-pill-val">${p.jersey_number}</div></div>`
    : `<div class="open-pill locked"><div class="open-pill-label">Jersey #</div><div class="open-pill-val">?</div></div>`;

  let hintBtns;
  if (!S.posRevealed) {
    hintBtns = `<button class="btn-reveal" id="btn-hint-pos"><span>Reveal position</span></button>`;
  } else if (!S.jerRevealed) {
    hintBtns = jerseyKnown
      ? `<button class="btn-reveal" id="btn-hint-jer"><span>Reveal jersey #</span></button>`
      : `<button class="btn-reveal" disabled>Jersey # — no data yet</button>`;
  } else {
    hintBtns = `<button class="btn-reveal" disabled>All hints used</button>`;
  }

  const missesHtml = S.misses.length
    ? `<div class="misses"><span class="miss-label">Strikes ${S.misses.length}/${MAX_MISSES}</span>${S.misses.map(m => `<span class="miss-chip">${m}</span>`).join('')}</div>`
    : `<div class="strikes-line">${MAX_MISSES} strikes per round</div>`;

  document.getElementById('screen').innerHTML = `
    <div class="game-wrap">
      <div class="round-counter">
        <div><div class="round-label">Player</div><div class="round-num">${S.round + 1} / ${ROUNDS}</div></div>
      </div>

      <div class="${cardCls}" id="tc">
        <div class="trail-header">
          <div class="trail-meta">CAREER TRAIL — ALWAYS VISIBLE</div>
          <div class="trail-open">
            <div class="open-pill"><div class="open-pill-label">College</div><div class="open-pill-val">${p.college}</div></div>
            ${posPill}${jerPill}
          </div>
        </div>
        <div class="trail-stops">${stopsHtml}</div>
      </div>

      ${hintBtns}
      ${S.poolMsg ? `<div class="strikes-line" style="color:#ef4444">Not in the player pool — no strike</div>` : missesHtml}

      <div class="input-wrap">
        <input class="guess-input" id="gi" value="${S.guess.replace(/"/g, '&quot;')}"
          placeholder="Type a player name..." autocomplete="off" autocorrect="off" spellcheck="false"/>
        ${S.suggs.length > 0 ? `
          <div class="suggestions" id="sl">
            ${S.suggs.map(s => `<div class="suggestion" data-val="${s}">${s}</div>`).join('')}
          </div>` : ''}
      </div>
      <button class="btn-submit" id="bs">SUBMIT</button>
    </div>`;

  const inp = document.getElementById('gi');
  if (inp) {
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.addEventListener('input', e => { S.guess = e.target.value; updateSuggs(e.target.value); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
  document.getElementById('bs')?.addEventListener('click', submit);
  document.getElementById('btn-hint-pos')?.addEventListener('click', () => doHint('pos'));
  document.getElementById('btn-hint-jer')?.addEventListener('click', () => doHint('jer'));
  document.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('mousedown', e => { e.preventDefault(); S.guess = el.dataset.val; S.suggs = []; submit(el.dataset.val); });
  });
}

function renderBetween() {
  const last = S.results[S.results.length - 1];
  const p = last.player;
  const stops = p.career_stops;

  let trailHtml = '';
  stops.forEach((stop, i) => {
    trailHtml += `<div class="trail-row" style="animation-delay:${i * .07}s"><div class="trail-row-num">${i + 1}</div><div class="trail-row-dot"></div><div class="trail-row-name">${stop}</div></div>`;
    if (i < stops.length - 1) trailHtml += `<div class="trail-connector-sm"></div>`;
  });

  const grade = last.grade;
  const gradeEmoji = GRADE_EMOJI[grade];
  const gradeLabel = grade === 'pin' ? 'PINNED IT' : grade === 'map' ? 'NEEDED A HINT' : 'STRUCK OUT';
  const gradeColor = grade === 'pin' ? '#22c55e' : grade === 'map' ? '#eab308' : '#ef4444';

  document.getElementById('screen').innerHTML = `
    <div class="between">
      <div class="between-card">
        <div class="between-pin">${gradeEmoji}</div>
        <div class="between-label" style="color:${gradeColor}">${gradeLabel}</div>
        <div class="between-player">${p.player_name}</div>
        <div class="between-detail">${p.college} · ${p.position}</div>
      </div>
      <div class="full-trail">
        <div style="font-size:9px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--ash);margin-bottom:8px">FULL CAREER TRAIL</div>
        ${trailHtml}
      </div>
      <div class="next-pulse">${S.round + 1 < ROUNDS ? 'Next player loading...' : 'Calculating results...'}</div>
    </div>`;
}

function renderResults() {
  const emojiRow = S.results.map(r => GRADE_EMOJI[r.grade]).join('');
  const pins = S.results.filter(r => r.grade === 'pin').length;

  // Tagline based on pin count
  const taglines = {
    5: "Five pins. You don't need the map.",
    4: "Nearly flawless. The trail holds no secrets.",
    3: "Sharp. A few detours, but you arrived.",
    2: "You got there. The map helped.",
    1: "One clean pin. We'll take it.",
    0: "The trail won today. Run it back."
  };
  const tagline = taglines[pins];
  const shareText = `PIT STOPS\n${emojiRow}\nyouknowball.io`;

  document.getElementById('screen').innerHTML = `
    <div class="results">
      <div class="results-hero">
        <div class="res-label">PIT STOPS · YouKnowBall.io</div>
        <div class="res-pins">${emojiRow}</div>
        <div class="res-tagline">"${tagline}"</div>
      </div>

      <div class="result-list">
        ${S.results.map(r => `
          <div class="result-row">
            <div class="res-emj">${GRADE_EMOJI[r.grade]}</div>
            <div class="res-info">
              <div class="res-name">${r.player.player_name}</div>
              <div class="res-detail">${r.player.college} · ${r.player.position}</div>
            </div>
            <div class="res-stops" style="color:${r.grade === 'pin' ? '#22c55e' : r.grade === 'map' ? '#eab308' : '#444'}">${r.grade === 'pin' ? 'CLEAN' : r.grade === 'map' ? (r.hints + ' HINT' + (r.hints > 1 ? 'S' : '')) : 'MISS'}</div>
          </div>`).join('')}
      </div>

      <div class="share-box">
        <div class="share-preview">
          <strong>PIT STOPS</strong><br>${emojiRow}
        </div>
        <button class="btn-share" id="bsh">SHARE RESULTS</button>
      </div>

      <button class="btn-play-again" id="bag">PLAY AGAIN</button>
      <div class="upnext">
        <div class="upnext-kicker">Up next</div>
        <a class="upnext-card" href="/">
          <div class="upnext-meta">
            <div class="upnext-title">Daily Game</div>
            <div class="upnext-hook">10 players. Name the college. Once a day.</div>
          </div>
          <div class="upnext-play">PLAY &gt;</div>
        </a>
        <a class="upnext-card" href="/streaker.html">
          <div class="upnext-meta">
            <div class="upnext-title">Streaker</div>
            <div class="upnext-hook">Name colleges back-to-back. Don't break the chain.</div>
          </div>
          <div class="upnext-play">PLAY &gt;</div>
        </a>
        <a class="upnext-card" href="/nts.html">
          <div class="upnext-meta">
            <div class="upnext-title">Name That Squad</div>
            <div class="upnext-hook">Which NFL offense is this? The colleges tell all.</div>
          </div>
          <div class="upnext-play">PLAY &gt;</div>
        </a>
      </div>
      <div class="midnight-note">New career trails every day</div>
    </div>`;

  document.getElementById('bsh').addEventListener('click', async () => {
    const btn = document.getElementById('bsh');
    if (navigator.share) {
      await navigator.share({ title: 'Pit Stops — YouKnowBall.io', text: shareText, url: 'https://youknowball.io/pitstops.html' });
    } else {
      await navigator.clipboard.writeText(shareText);
      btn.textContent = 'COPIED ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'SHARE RESULTS'; btn.classList.remove('copied'); }, 2000);
    }
  });

  document.getElementById('bag').addEventListener('click', () => {
    S = { round: 0, hints: 0, posRevealed: false, jerRevealed: false, misses: [], guess: '', suggs: [], flash: null, poolMsg: false, results: [], phase: 'rules' };
    render();
  });
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────

function doHint(which) {
  if (which === 'pos' && !S.posRevealed) { S.posRevealed = true; S.hints++; }
  if (which === 'jer' && S.posRevealed && !S.jerRevealed) { S.jerRevealed = true; S.hints++; }
  S.suggs = [];
  render();
}

function updateSuggs(val) {
  if (val.length < 2) { S.suggs = []; render(); return; }
  const q = val.toLowerCase();
  S.suggs = allNames.filter(n => n.toLowerCase().includes(q)).slice(0, 6);
  render();
}

function submit(override) {
  const val = (override || S.guess).trim();
  if (!val) return;
  const p = players[S.round];
  // Typo protection: names outside the player pool don't cost a strike.
  const vl = val.toLowerCase();
  const inPool = allNames.some(n => { const nl = n.toLowerCase(); return nl === vl || nl.includes(vl); });
  if (!inPool) {
    S.flash = 'wrong';
    S.poolMsg = true;
    render();
    setTimeout(() => { S.flash = null; S.poolMsg = false; render(); }, 1100);
    return;
  }
  const correct = p.player_name.toLowerCase() === vl ||
    p.player_name.toLowerCase().includes(vl);
  S.suggs = [];

  if (correct) {
    S.flash = 'correct';
    render();
    setTimeout(() => {
      S.flash = null;
      const r = { player: p, correct: true, hints: S.hints, misses: S.misses.length };
      r.grade = gradeFor(r);
      S.results.push(r);
      advance();
    }, 500);
  } else {
    S.misses.push(val);
    S.guess = '';
    S.flash = 'wrong';
    render();
    setTimeout(() => {
      S.flash = null;
      if (S.misses.length >= MAX_MISSES) {
        // Struck out
        const r = { player: p, correct: false, hints: S.hints, misses: S.misses.length, grade: 'miss' };
        S.results.push(r);
        advance();
      } else {
        render();
      }
    }, 600);
  }
}

function advance() {
  S.phase = 'between';
  render();
  setTimeout(() => {
    if (S.round + 1 >= ROUNDS) {
      S.phase = 'results';
    } else {
      S.round++;
      S.hints = 0;
      S.posRevealed = false;
      S.jerRevealed = false;
      S.misses = [];
      S.guess = '';
      S.poolMsg = false;
      S.phase = 'playing';
    }
    render();
  }, 2400);
}

init();
</script>
</body>
</html>
